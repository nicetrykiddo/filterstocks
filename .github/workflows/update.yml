name: Daily scan

# Computes the scan with our own engine after the close (bhavcopy archives
# for both exchanges publish by ~19:00 IST), verifies the payload, checks
# parity against RPCI's published readings when a fresh reference payload
# exists, and commits public/scan.json. The push is what makes Vercel
# redeploy: run it, verify it, commit it, let Vercel pick it up.
#
# data/bars.json (the 30 MB price store) is not tracked in git; it rides the
# Actions cache and falls back to a full backfill on a cold cache.

on:
  schedule:
    # 14:30 UTC = 20:00 IST, after both exchanges' bhavcopies are out.
    - cron: "30 14 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scan-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore price store
        uses: actions/cache@v4
        with:
          path: data/bars.json
          key: bars-${{ github.run_id }}
          restore-keys: |
            bars-

      - name: Install dependencies
        run: npm ci

      - name: Run the scan pipeline
        run: npx tsx scripts/update.ts

      - name: Verify payload invariants
        run: npx tsx scripts/verify.ts

      - name: Parity check against the reference
        run: npx tsx scripts/parity.ts
        continue-on-error: true

      - name: Commit if changed
        run: |
          git config user.name "scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/scan.json data/fundamentals.json
          if git diff --cached --quiet; then
            echo "No changes; dataset already current."
          else
            git commit -m "data: daily scan $(date -u +%F)"
            git push
          fi
