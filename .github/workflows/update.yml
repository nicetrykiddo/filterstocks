name: Daily scan update

# Rebuilds the dataset after the NSE session closes and commits the artifact.
# A push to main is what makes Vercel redeploy, so this workflow is the
# heartbeat of the site: run it, commit scan.json, let Vercel pick it up.

on:
  schedule:
    # 12:20 UTC = 17:50 IST, after the post-close bhavcopy is published.
    - cron: "20 12 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scan-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install tsx
        run: npm install --no-save tsx

      - name: Update dataset
        run: tsx scripts/update.ts

      - name: Commit if changed
        run: |
          git config user.name "scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bars.json public/scan.json
          if git diff --cached --quiet; then
            echo "No changes; dataset already current."
          else
            git commit -m "data: scan update $(date -u +%F)"
            git push
          fi
