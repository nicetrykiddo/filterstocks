name: Daily scan mirror

# Fetches RPCI's published daily scan after its evening run, commits the
# converted artifact. A push to main is what makes Vercel redeploy, so this
# workflow is the heartbeat of the site: run it, commit scan.json, let Vercel
# pick it up.

on:
  schedule:
    # 14:30 UTC = 20:00 IST, after RPCI's live evening scan is published.
    - cron: "30 14 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scan-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install tsx
        run: npm install --no-save tsx

      - name: Mirror dataset
        run: tsx scripts/fetch-rpci.ts

      - name: Commit if changed
        run: |
          git config user.name "scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/scan.json data/fundamentals.json
          if git diff --cached --quiet; then
            echo "No changes; dataset already current."
          else
            git commit -m "data: scan mirror $(date -u +%F)"
            git push
          fi
